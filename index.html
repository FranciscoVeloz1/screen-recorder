<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grabadora de Pantalla</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f0f13;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        margin-bottom: 32px;
        color: #fff;
      }

      .card {
        background: #1a1a23;
        border: 1px solid #2a2a38;
        border-radius: 16px;
        padding: 32px;
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .option-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 140px;
      }

      label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #888;
      }

      select {
        background: #12121a;
        border: 1px solid #2a2a38;
        border-radius: 8px;
        color: #e0e0e0;
        padding: 8px 12px;
        font-size: 0.9rem;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
      }

      select:focus {
        border-color: #5b6af5;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        color: #ccc;
        cursor: pointer;
        user-select: none;
      }

      .toggle {
        position: relative;
        width: 38px;
        height: 22px;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: #2a2a38;
        border-radius: 22px;
        transition: background 0.2s;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }

      .toggle input:checked + .slider {
        background: #5b6af5;
      }

      .toggle input:checked + .slider::before {
        transform: translateX(16px);
      }

      .preview-wrap {
        position: relative;
        background: #0a0a10;
        border-radius: 10px;
        overflow: hidden;
        aspect-ratio: 16/9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }

      .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: #444;
      }

      .placeholder svg {
        opacity: 0.4;
      }

      .placeholder p {
        font-size: 0.85rem;
      }

      .timer {
        position: absolute;
        top: 10px;
        right: 12px;
        background: rgba(220, 50, 50, 0.85);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        display: none;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 7px;
        height: 7px;
        background: #fff;
        border-radius: 50%;
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .controls {
        display: flex;
        gap: 12px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:active {
        transform: scale(0.97);
      }

      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      #btnStart {
        background: #5b6af5;
        color: #fff;
      }

      #btnStop {
        background: #e04444;
        color: #fff;
      }

      #btnDownload {
        background: #27ae60;
        color: #fff;
      }

      .recordings {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .recordings h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #666;
      }

      .recording-item {
        background: #12121a;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.88rem;
      }

      .rec-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-width: 0;
      }

      .rec-name {
        color: #ddd;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .rec-meta {
        color: #555;
        font-size: 0.78rem;
      }

      .rec-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .rec-actions button {
        flex: none;
        padding: 6px 14px;
        font-size: 0.8rem;
        border-radius: 7px;
      }

      .btn-dl {
        background: #1e3a2e;
        color: #4cd07d;
        border: 1px solid #2a5040;
      }

      .btn-del {
        background: #3a1e1e;
        color: #e07070;
        border: 1px solid #502a2a;
      }

      .status {
        font-size: 0.82rem;
        color: #666;
        text-align: center;
        min-height: 1.2em;
      }

      .status.error {
        color: #e07070;
      }
      .status.ok {
        color: #4cd07d;
      }
    </style>
  </head>
  <body>
    <h1>Grabadora de Pantalla</h1>

    <div class="card">
      <!-- Opciones -->
      <div class="options">
        <div class="option-group">
          <label>Calidad de video</label>
          <select id="quality">
            <option value="2500000">Media (2.5 Mbps)</option>
            <option value="5000000" selected>Alta (5 Mbps)</option>
            <option value="8000000">Muy alta (8 Mbps)</option>
          </select>
        </div>
        <div class="option-group">
          <label>Formato</label>
          <select id="format">
            <option value="video/webm;codecs=vp9">WebM (VP9)</option>
            <option value="video/webm;codecs=vp8">WebM (VP8)</option>
            <option value="video/mp4">MP4</option>
          </select>
        </div>
        <div class="option-group" style="justify-content: flex-end">
          <label for="audioToggle">Incluir audio del sistema</label>
          <label class="toggle-row">
            <span class="toggle">
              <input type="checkbox" id="audioToggle" checked />
              <span class="slider"></span>
            </span>
            <span id="audioLabel">Activado</span>
          </label>
        </div>
      </div>

      <!-- Preview -->
      <div class="preview-wrap" id="previewWrap">
        <div class="placeholder" id="placeholder">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="2" y="3" width="20" height="15" rx="2" />
            <path d="M8 21h8M12 18v3" />
          </svg>
          <p>La vista previa aparecerá aquí</p>
        </div>
        <video id="preview" autoplay muted playsinline></video>
        <div class="timer" id="timer">
          <span class="dot"></span>
          <span id="timerText">00:00</span>
        </div>
      </div>

      <!-- Controles -->
      <div class="controls">
        <button id="btnStart">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10" />
          </svg>
          Grabar
        </button>
        <button id="btnStop" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2" />
          </svg>
          Detener
        </button>
        <button id="btnDownload" disabled>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M12 5v10M7 15l5 5 5-5" />
            <path d="M5 20h14" />
          </svg>
          Descargar
        </button>
      </div>

      <p class="status" id="status">Listo para grabar</p>

      <!-- Lista de grabaciones -->
      <div class="recordings" id="recordingsSection" style="display: none">
        <h2>Grabaciones de esta sesion</h2>
        <div id="recordingsList"></div>
      </div>
    </div>

    <script>
      const btnStart = document.getElementById("btnStart");
      const btnStop = document.getElementById("btnStop");
      const btnDownload = document.getElementById("btnDownload");
      const preview = document.getElementById("preview");
      const placeholder = document.getElementById("placeholder");
      const timerEl = document.getElementById("timer");
      const timerText = document.getElementById("timerText");
      const statusEl = document.getElementById("status");
      const audioToggle = document.getElementById("audioToggle");
      const audioLabel = document.getElementById("audioLabel");
      const recordingsList = document.getElementById("recordingsList");
      const recordingsSection = document.getElementById("recordingsSection");

      let mediaRecorder = null;
      let chunks = [];
      let stream = null;
      let timerInterval = null;
      let seconds = 0;
      let recordings = [];

      audioToggle.addEventListener("change", () => {
        audioLabel.textContent = audioToggle.checked
          ? "Activado"
          : "Desactivado";
      });

      // Detectar codecs soportados y poblar el select
      const formatSelect = document.getElementById("format");
      const types = [
        { label: "WebM (VP9)", value: "video/webm;codecs=vp9" },
        { label: "WebM (VP8)", value: "video/webm;codecs=vp8" },
        { label: "MP4", value: "video/mp4" },
      ];
      formatSelect.innerHTML = "";
      types.forEach((t) => {
        if (MediaRecorder.isTypeSupported(t.value)) {
          const opt = document.createElement("option");
          opt.value = t.value;
          opt.textContent = t.label;
          formatSelect.appendChild(opt);
        }
      });
      if (!formatSelect.options.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Formato por defecto";
        formatSelect.appendChild(opt);
      }

      function setStatus(msg, type = "") {
        statusEl.textContent = msg;
        statusEl.className = "status " + type;
      }

      function formatTime(s) {
        const m = Math.floor(s / 60)
          .toString()
          .padStart(2, "0");
        const ss = (s % 60).toString().padStart(2, "0");
        return `${m}:${ss}`;
      }

      function startTimer() {
        seconds = 0;
        timerText.textContent = formatTime(seconds);
        timerEl.style.display = "flex";
        timerInterval = setInterval(() => {
          seconds++;
          timerText.textContent = formatTime(seconds);
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timerInterval);
        timerEl.style.display = "none";
      }

      btnStart.addEventListener("click", async () => {
        try {
          setStatus("Selecciona la pantalla a grabar...");

          const displayStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 30 } },
            audio: audioToggle.checked,
          });

          let audioStream = null;
          if (audioToggle.checked) {
            try {
              audioStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false,
              });
            } catch (_) {
              // El usuario puede denegar el mic, continuamos sin el
            }
          }

          const tracks = [...displayStream.getTracks()];
          if (audioStream) tracks.push(...audioStream.getAudioTracks());
          stream = new MediaStream(tracks);

          preview.srcObject = displayStream; // preview sin audio del mic para evitar eco
          preview.style.display = "block";
          placeholder.style.display = "none";

          const mimeType = formatSelect.value;
          const bitsPerSecond = parseInt(
            document.getElementById("quality").value,
          );
          const options = { bitsPerSecond };
          if (mimeType) options.mimeType = mimeType;

          mediaRecorder = new MediaRecorder(stream, options);
          chunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, {
              type: mediaRecorder.mimeType || "video/webm",
            });
            const url = URL.createObjectURL(blob);
            const ext = (mediaRecorder.mimeType || "video/webm").includes("mp4")
              ? "mp4"
              : "webm";
            const name = `grabacion_${new Date().toISOString().replace(/[:.]/g, "-")}.${ext}`;
            addRecording({ url, name, duration: seconds, size: blob.size });
            btnDownload.onclick = () => triggerDownload(url, name);
            btnDownload.disabled = false;
            setStatus("Grabacion finalizada. Listo para descargar.", "ok");
          };

          // Cuando el usuario cierra el selector de pantalla
          displayStream.getVideoTracks()[0].onended = () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive")
              stopRecording();
          };

          mediaRecorder.start(1000); // chunk cada segundo
          startTimer();

          btnStart.disabled = true;
          btnStop.disabled = false;
          btnDownload.disabled = true;
          setStatus("Grabando...", "");
        } catch (err) {
          if (err.name === "NotAllowedError") {
            setStatus("Permiso denegado o seleccion cancelada.", "error");
          } else {
            setStatus("Error: " + err.message, "error");
          }
        }
      });

      btnStop.addEventListener("click", stopRecording);

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== "inactive")
          mediaRecorder.stop();
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stopTimer();
        preview.srcObject = null;
        preview.style.display = "none";
        placeholder.style.display = "flex";
        btnStart.disabled = false;
        btnStop.disabled = true;
      }

      function triggerDownload(url, name) {
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
      }

      function formatBytes(b) {
        if (b < 1024 * 1024) return (b / 1024).toFixed(0) + " KB";
        return (b / 1024 / 1024).toFixed(1) + " MB";
      }

      function addRecording({ url, name, duration, size }) {
        recordings.push({ url, name, duration, size });
        recordingsSection.style.display = "flex";

        const item = document.createElement("div");
        item.className = "recording-item";
        item.innerHTML = `
        <div class="rec-info">
          <span class="rec-name">${name}</span>
          <span class="rec-meta">${formatTime(duration)} &nbsp;·&nbsp; ${formatBytes(size)}</span>
        </div>
        <div class="rec-actions">
          <button class="btn-dl">Descargar</button>
          <button class="btn-del">Eliminar</button>
        </div>
      `;
        item.querySelector(".btn-dl").onclick = () =>
          triggerDownload(url, name);
        item.querySelector(".btn-del").onclick = () => {
          URL.revokeObjectURL(url);
          item.remove();
          if (!recordingsList.children.length)
            recordingsSection.style.display = "none";
        };
        recordingsList.appendChild(item);
      }
    </script>
  </body>
</html>
